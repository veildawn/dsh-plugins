# Ensure @deepseek-ai/dsh-client-connection has webStartup + webServer injected
# so rpc.handle can register HTTP routes.
# NOTE: webRuntime is intentionally NOT injected: the dsh-web-app web-runtime
# row that provides it no longer activates on DSH desktop 0.2.1+, so injecting
# it makes `connection` wait forever and no RPC channel gets registered --
# the SPA fallback then answers POST with HTTP 405.
# webStartup must stay listed because a patch row's `inject` REPLACES the
# previous one wholesale (last write wins), and the connection row's own
# config reads ctx.webStartup.trustedHosts.
- id: connection
  inject:
    - webStartup
    - webServer

# Mount the IM bot host half with every channel disabled. The row id MUST match
# the `name` exported by lib/index.js (`im-bot`) -- a `service: { plugins: ... }`
# tree shape here would be skipped by the loader with "id is required for
# non-insert patches" and the plugin would never mount.
#
# Nothing connects to a chat service until the user turns a channel on in
# Settings -> 集成机器人, so installing this bundle changes no behaviour.
- insert:
    - id: im-bot
      name: '@weniatall/dsh-im-bot'
      inject:
        - webServer
        - connection
      config:
        enabled: false

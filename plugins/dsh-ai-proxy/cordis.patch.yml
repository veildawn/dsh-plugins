# Ensure @deepseek-ai/dsh-client-connection has webStartup + webServer injected
# so rpc.handle can register HTTP routes.
# NOTE: webRuntime is intentionally NOT injected: the dsh-web-app web-runtime
# row that provides it no longer activates on DSH desktop 0.2.1+, so injecting
# it makes `connection` wait forever and no RPC channel (e.g. /ai-proxy-auth)
# gets registered -- the SPA fallback then answers POST with HTTP 405.
# webStartup must stay listed because a patch row's `inject` REPLACES the
# previous one wholesale (last write wins), and the connection row's own
# config reads ctx.webStartup.trustedHosts.
- id: connection
  inject:
    - webStartup
    - webServer

# The dsh-ai-proxy bundle patch: mounts the plugin's host half with neutral
# defaults. Applied as one bundle layer; the user's profile cordis.patch.yml
# can still target the same row id (last write wins) and the gateway address
# is edited in the independent AI Proxy settings section at runtime.
- insert:
    - id: llm-ai-proxy
      name: dsh-ai-proxy
      config:
        baseURL: http://localhost:18080
        clientId: dsh

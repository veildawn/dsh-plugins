# Ensure @deepseek-ai/dsh-client-connection has webServer injected so rpc.handle can register HTTP routes
- id: connection
  inject:
    - webRuntime
    - webServer

# Cordis bundle patch: mounts the file viewer's host half.
#
# Patches apply in `dsh.profile.bundles` order, so a later bundle (and finally
# the user's own profile patch) can override this row by reusing the same id.
- insert:
    - id: file-viewer
      name: dsh-file-viewer

# Ensure @deepseek-ai/dsh-client-connection has webStartup + webServer injected
# so rpc.handle can register HTTP routes.
# NOTE: webRuntime is intentionally NOT injected: the dsh-web-app web-runtime
# row that provides it no longer activates on DSH desktop 0.2.1+, so injecting
# it makes `connection` wait forever and no RPC channel gets registered --
# the SPA fallback then answers POST with HTTP 405.
# webStartup must stay listed because a patch row's `inject` REPLACES the
# previous one wholesale (last write wins), and the connection row's own
# config reads ctx.webStartup.trustedHosts.
- id: connection
  inject:
    - webStartup
    - webServer

# dsh bundle patch: inserts this plugin into a profile's layer stack.
#
# The row id must NOT be `plugin-manager`: layers address rows by id with the
# last write winning, and the host's own base bundle already uses that id for
# `@deepseek-ai/dsh-plugin-manager` - the plugin that provides the
# `pluginManager` service. Reusing the id shadowed the host plugin, so the
# 创造模式 (cordis) preset's `@deepseek-ai/dsh-plugin-manager/tools` row waited
# forever for a service nobody registered. This row owns its own id instead.
- insert:
    - id: dsh-plugin-manager
      name: dsh-plugin-manager
